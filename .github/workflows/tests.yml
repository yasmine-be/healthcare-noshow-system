name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q main.py dashboard.py database.py db_connection.py feature_engineering.py generate_data.py train_model.py models.py schemas.py auth.py assistant_agent.py risk.py create_user.py migrations tests
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check migration configuration
        run: python -m alembic history
